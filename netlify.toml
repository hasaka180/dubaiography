# Netlify detects Next.js and applies its runtime adapter automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Declared explicitly: Netlify's automatic detection skipped it on this site,
# which published the raw build output and 404ed every page.
[[plugins]]
  package = "@netlify/plugin-nextjs"
